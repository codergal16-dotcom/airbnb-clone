<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airbnb Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span>airbnb</span>
    </div>

    <div class="search-bar">
      <button class="search-item">Anywhere</button>
      <span class="divider"></span>
      <button class="search-item">Any week</button>
      <span class="divider"></span>
      <button class="search-item">Add guests</button>
      <button class="search-icon">🔍</button>
    </div>

    <nav class="header-nav">
      <a href="#" class="host-link">Airbnb your home</a>
      <button class="globe-icon">🌐</button>
      <div class="user-menu">☰ 👤</div>
    </nav>
  </header>
    <div class="filter-bar">
     <button class="filter-pill">Type of place</button>
     <button class="filter-pill">Price</button>
     <button class="filter-pill">Rooms and beds</button>
     <button class="filter-pill">Amenities</button>
     <button class="filter-pill">More filters</button>
    </div>
    <main class="listings-grid">

        <div class="listing-card">
          <div class="listing-image"></div>
          <div class="listing-info">
            <div class="listing-top-row">
              <span class="listing-location">Lekki, Nigeria</span>
              <span class="listing-rating">⭐ 4.92</span>
            </div>
            <p class="listing-dates">Nov 3 – 8</p>
            <p class="listing-price"><strong>₦45,000</strong> night</p>
          </div>
        </div>
      
        <div class="listing-card">
          <div class="listing-image"></div>
          <div class="listing-info">
            <div class="listing-top-row">
              <span class="listing-location">Ikoyi, Nigeria</span>
              <span class="listing-rating">⭐ 4.87</span>
            </div>
            <p class="listing-dates">Dec 1 – 6</p>
            <p class="listing-price"><strong>₦62,000</strong> night</p>
          </div>
        </div>
      
        <div class="listing-card">
          <div class="listing-image"></div>
          <div class="listing-info">
            <div class="listing-top-row">
              <span class="listing-location">Victoria Island, Nigeria</span>
              <span class="listing-rating">⭐ 4.95</span>
            </div>
            <p class="listing-dates">Oct 20 – 25</p>
            <p class="listing-price"><strong>₦58,000</strong> night</p>
          </div>
        </div>
      
        <div class="listing-card">
          <div class="listing-image"></div>
          <div class="listing-info">
            <div class="listing-top-row">
              <span class="listing-location">Ajah, Nigeria</span>
              <span class="listing-rating">⭐ 4.80</span>
            </div>
            <p class="listing-dates">Nov 12 – 17</p>
            <p class="listing-price"><strong>₦35,000</strong> night</p>
          </div>
        </div>
      
      </main>
</body>
</html>
