<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Airbnb Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span>airbnb</span>
    </div>
    <div class="search-bar">
      <button class="search-item">Anywhere</button>
      <span class="divider"></span>
      <button class="search-item">Any week</button>
      <span class="divider"></span>
      <button class="search-item">Add guests</button>
      <button class="search-icon">🔍</button>
    </div>
    <nav class="header-nav">
      <a href="#" class="host-link">Airbnb your home</a>
      <button class="globe-icon">🌐</button>
      <div class="user-menu">☰ 👤</div>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Log in</h1>

      <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit" class="reserve-btn">Continue</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

</body>
</html>
